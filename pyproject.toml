[project]
name = "nemotron-rag-app"
version = "0.1.0"
description = "Local Nemotron VL RAG pipeline extending deep_rag with LangGraph and vLLM."
authors = [{ name = "Omar (SCMC Limited)", email = "example@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "vllm>=0.6.0",
    "transformers>=4.43.0",
    "torch>=2.3.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxruntime-tools>=1.8.0",
    "huggingface-hub>=0.24.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.1"
]

[project.scripts]
nemotron-download = "backend.app.scripts.download_model:app"
nemotron-export-onnx = "backend.app.scripts.export_onnx:app"
nemotron-quantize-onnx = "backend.app.scripts.quantize_onnx:app"
nemotron-export-gguf = "backend.app.scripts.export_gguf:app"

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"
